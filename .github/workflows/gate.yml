name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structure, links, scripts, private strings, voice
        run: python3 tools/check.py
      - name: Overview in README.md and docs/INDEX.md is up to date
        run: python3 tools/build_index.py --check
      - name: Third-party notice is up to date
        run: python3 tools/build_third_party.py --check
