name: traffic

# Keeps the downloads badge of the README up to date. It runs .github/scripts/downloads.py, which explains the count.
# The totals live on the branch "traffic": downloads.json, badge.svg and badge.json.
#
# GitHub reports clones for 14 days only, so this runs once a day, and once after every push to main.
# The clone counts need a repository secret named TRAFFIC_TOKEN: a fine-grained personal access token for this
# repository with the permission "Administration: read-only". Without it the badge keeps its last number.
# The job reads and writes through the API and checks nothing out, so it adds no clone of its own.

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Count the downloads and draw the badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/scripts/downloads.py?ref=$GITHUB_SHA" -o downloads.py
          python3 downloads.py
