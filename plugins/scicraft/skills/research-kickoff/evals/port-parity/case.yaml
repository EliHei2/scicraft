schema_version: "1.1"
name: port-parity
expected_outcome: |
  The response compares the two output files row by row after matching the dataset ids (the row orders differ)
  and accounting for the authors' per-dimension min-max scaling. It reports the minimum per-dimension Pearson r
  and names dimension d5 as the one that does not match (r far below 0.999 while the other seven are about
  1.0000), and it reports a distance-structure comparison. It concludes that the port is not yet an exact
  reproduction, so it must not be listed under the paper's name as R; it advises checking the released code for
  how d5 is computed. STATUS.md gets a row typed A (or not yet R) with the parity numbers as evidence. The input
  CSV files are unchanged.
context:
  scaffold_script: place-files.sh
