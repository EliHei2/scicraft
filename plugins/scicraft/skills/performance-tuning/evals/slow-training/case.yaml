schema_version: "1.1"
name: slow-training
expected_outcome: |
  The agent measures before it changes anything: time per stage (data loading against forward, backward and
  optimizer step) for the original train.py, and finds that the data path binds (the per-sample neighbor
  search in eight DataLoader workers, with thread pools not pinned). It changes one thing at a time, measuring
  each, for example pinning threads per worker and moving or vectorizing the neighbor computation, and keeps
  only changes whose logged loss at the fixed seed matches the original run step for step (or states the
  tolerance and why). It does not speed up by using fewer samples, fewer points or fewer neighbors. PERF_NOTES.md
  holds one entry per attempt with the measured before and after, including attempts that were reverted, and
  the final message gives the overall speed-up with the measurement behind it and says what was not tested
  (for example that no GPU was available).
context:
  scaffold_script: place-files.sh
