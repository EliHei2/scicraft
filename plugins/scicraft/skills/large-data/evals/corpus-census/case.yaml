schema_version: "1.1"
name: corpus-census
expected_outcome: |
  The census identifies datasets by content: downloads_old/export_17.parquet is byte-identical to
  site_a/clicks_2025.parquet and is counted once, found by checksum or byte comparison, not by
  name. site_b/clicks_2025_clean.parquet is the output of a cleaning pipeline on
  site_b/clicks_2025.parquet (sources.csv says so; same rows plus a column) and is not counted as
  a separate dataset. site_c/clicks_2025.csv.gz is truncated and cannot be read, and the two
  site_d entries in sources.csv are not present locally. The rows counted are 43,000 over the
  four readable raw datasets (12,000 + 15,000 + 9,000 + 7,000). The response states the coverage
  of that total (4 counted of 7 raw entries listed, a floor), names what is missing or unreadable,
  gives the conservation arithmetic of the deduplication, and the pasteable sentence does not
  present 43,000 as the total of the whole collection. No file in corpus/ is deleted or changed.
context:
  scaffold_script: place-files.sh
