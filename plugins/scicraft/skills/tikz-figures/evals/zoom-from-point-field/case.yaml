schema_version: "1.1"
name: zoom-from-point-field
expected_outcome: |
  A folder zoom_fig with a self-contained TikZ figure and its PDF built from field.csv by a generator script (not
  hand-typed coordinates): the whole field as density bands, nested zoom windows of the same field, a level showing the
  individual points, and one point with its 6 nearest neighbors drawn as spokes inside a light ring with a z_u label
  and no leader line. Zoom boxes on each frame are linked to the next frame by dashed connectors. The geometry is
  deterministic (seeded or fully data-driven) and a facts file records the numbers. The final message gives caption
  numbers (1350 points, three categories, k = 6) that match the facts file and field.csv, and says how the ego point
  was chosen.
context:
  scaffold_script: place-files.sh
