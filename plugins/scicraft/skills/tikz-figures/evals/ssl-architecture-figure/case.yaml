schema_version: "1.1"
name: ssl-architecture-figure
expected_outcome: |
  A folder fig1 with a standalone TikZ source and its compiled PDF (plus a preview PNG that was looked at) showing a
  teacher-student two-rail layout: the context encoder over visible tokens, the predictor fed the context and the mask
  tokens, the target encoder over the full input with stop-gradient, an EMA arrow from the context encoder to the
  target encoder, and both rails meeting at the latent L1 loss. The figure uses a sans font for text and math, one
  accent hue for the model plus one contrast hue reserved for the masked or target tokens, greys for structure, no
  shadows or gradients, no sentences inside the figure, and nothing overlapping. The final message names the files,
  says the figure compiled and was rendered and inspected, and says what was not checked.
