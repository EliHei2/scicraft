schema_version: "1.1"
name: training-curves-serif
expected_outcome: |
  A folder curves with a standalone PGFPlots source and PDF in a Palatino (serif) font for text and math, showing for
  each of the two methods the mean validation loss over the 3 seeds against step and a shaded band of plus or minus
  one standard deviation, computed from runs.csv (in a script or from a table the source reads), without smoothing or
  invented points. Axes are despined (left and bottom only, ticks outside), the legend is frameless or the lines are
  labeled inline, and only two hues are used. The final mean of our model at step 10000 is about 0.287. The final
  message states what the band is (std over 3 seeds, and whether sample or population std) and that the PDF was
  rendered and inspected.
context:
  scaffold_script: place-files.sh
