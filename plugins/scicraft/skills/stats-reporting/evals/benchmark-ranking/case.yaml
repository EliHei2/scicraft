schema_version: "1.1"
name: benchmark-ranking
expected_outcome: |
  A file ranking.md with a headline sentence and a table that aggregate fold_scores.csv by a Bradley-Terry
  (Elo-scale) rating from per-fold games, reported with mean rank and with the rating's uncertainty as an
  interquartile range from a bootstrap over folds. "catboost" and "CatBoost" are treated as one method or flagged
  to the user, and "housing_specialist", present on one task only, is excluded from the rating with the reason
  given. The rating puts "ours" first but mean rank puts "tabbase" first, so the text claims first only by the
  rating, states the mean rank honestly, and does not call the lead over tabbase significant; it gives a
  bootstrap share instead. The wording uses measured relations, with no "wins", "beats", "best", "strongest" or
  "outperforms". The method (games per fold, task weighting, number of bootstrap draws) is stated.
context:
  scaffold_script: place-files.sh
