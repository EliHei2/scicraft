schema_version: "1.1"
name: circular-win
expected_outcome: |
  The response recognizes that the alignment metric (mean cosine between paired embeddings) is the quantity the
  model's InfoNCE loss maximizes, so it cannot show that the model is better; recall@10 is the readout to lead
  with, and on it the model ranks second, below baseline_e5_like. It also finds that eval_retrieval.py draws a
  different 2,000-pair subsample for each model from one generator advanced across models, so the models were
  not scored on the same items, and asks for a rerun on identical indices or the full test set before any
  comparison is claimed; with one subsample and no per-unit scores no significance can be stated.
  results_paragraph.md does not say the model is the best overall, does not lead with alignment as evidence of
  superiority, reports recall@10 for all four models with the model's actual standing, and marks the numbers as
  provisional until the rerun. The final message explains both problems in plain words.
context:
  scaffold_script: place-files.sh
