schema_version: "1.1"
name: intake-coauthor-draft
expected_outcome: |
  The incoming text is treated as text from outside the loop. Its sentences are placed as supplied, with no sentence
  reworded, added or moved; at most the citation key shwartz2022tabular is mapped to the existing entry
  shwartzziv2022tabular (same work, found by title) and a header comment is added. The accepted version is kept
  (snapshot or copy) so it can be restored. The incoming text is measured against the accepted version (length, sentence and
  paragraph figures, gate hits), and the header comment or the final message lists what it does not yet carry:
  the retired value 0.79 (the facts file gives 0.842 against 0.811), a result stated in the introduction, an
  unsupported speed claim with a NEEDS_CITATION key, a citation key absent from refs.bib (borisov2022deep), a colon in
  the heading, banned patterns (em dashes, Importantly, novel, principled, state-of-the-art, a sentence describing
  the paper's organization), and the dropped required statement or comparator. The final message hands the decision
  back to the user in short form and recommends against shipping the retired number, without silently fixing it.
context:
  scaffold_script: place-files.sh
