  Table); the results sentence with macro F1 0.71, outperforms and P < 0.001 (move to Results); missing Statistics and
  reproducibility and Data availability sections; and a Code availability statement with only a GitHub link (needs an
  archived version with a DOI and a license). It does not invent values for the missing items.
